name: Deploy production to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install canonical renderer
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Build production
        run: python scripts/build_github_pages.py --base-path "/"

      - name: Check analytics consent and conversion events
        run: node --test scripts/analytics.test.cjs

      - name: Check CSS contract and navigation commands
        run: node --test scripts/css-contract.test.cjs scripts/site-navigation.test.cjs

      - name: Check sprite-sheet assembly algorithms
        run: node --test scripts/sprite-sheet-core.test.cjs

      - name: Check image-compressor export algorithms
        run: node --test scripts/image-compressor-core.test.cjs

      - name: Check PBR channel data and PNG encoding
        run: node --test scripts/pbr-channel-core.test.cjs

      - name: Check noise maps and canonical components
        run: node --test scripts/noise-generator-core.test.cjs lab/atlas-ui/contract.test.cjs lab/atlas-ui/project-media.test.cjs lab/atlas-ui/related-records.test.cjs

      - name: Audit production SEO and internal links
        run: python scripts/audit_site.py

      - name: Check canonical public pages and tool exports
        run: |
          python -m http.server 8767 --bind 127.0.0.1 --directory _site >/tmp/atlas-site.log 2>&1 &
          ATLAS_SERVER_PID=$!
          trap 'kill "$ATLAS_SERVER_PID"' EXIT
          node scripts/audit_canonical_browser.cjs
          node scripts/pbr-channel.browser.cjs http://127.0.0.1:8767/online-tools/pbr-channel-packer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

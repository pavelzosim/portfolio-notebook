name: Refresh Gumroad shelf data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gumroad-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refresh Gumroad shelf
        run: python scripts/update_gumroad_shelf.py

      - name: Validate build
        run: python scripts/build_github_pages.py --base-path "/"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No price/sales changes today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: refresh Gumroad shelf prices and sales counts"
          git push

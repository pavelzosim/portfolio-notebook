<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Atlas component fixtures</title></head><body>
<template>
 <header class="document-head"><p class="breadcrumb">Atlas / Style Guide</p><h1>Style Guide</h1><p>The canonical register for site styles, components and interaction states. Pages compose these components; they do not create their own visual variants.</p></header>
 <section class="document-section" id="contract"><header class="section-label"><span>00</span><h2>Single source of truth</h2></header>
 <p>Before adding UI, find its component here. If no component fits, extend this register and its shared implementation first, then use it on the page. A page-specific class is allowed for content layout or rendering, not a second button, status, note or form style.</p>
 <dl><dt>tokens.css</dt><dd>Colours, typography, spacing and dimensions. The live values below come from this file.</dd><dt>shell.css</dt><dd>Header, rails, workspace and Commander navigation.</dd><dt>components.css</dt><dd>Reusable visual components and their states.</dd><dt>fixtures.css</dt><dd>Page composition and specialised content layout only.</dd><dt>control-disclosure.js</dt><dd>Shared native Collapse / Expand behaviour.</dd></dl>
 <p>Preserve native semantics: links navigate, buttons act, labels name fields, status regions announce changes. Support always uses the yellow Support variant. Explanations use System Note; changing process messages use Status.</p>
 </section>
 <section class="document-section" id="tokens"><header class="section-label"><span>01</span><h2>Live design tokens</h2></header><div class="prose-sample"><p>These are computed values from the same stylesheet used by every candidate page, not a separately maintained palette.</p><dl id="token-register"></dl></div></section>
 <section class="document-section" id="actions"><header class="section-label"><span>01</span><h2>Actions</h2></header>
  <p>Use Primary for the main action: validate, process, generate or export. Use Quiet for secondary actions and yellow for support. A new label does not create a new button style.</p>
  <div class="action-row"><button class="button" type="button">Primary action</button><button class="button button--quiet" type="button">Quiet action</button><button class="button" type="button" disabled>Unavailable</button></div>
  <div class="action-row"><a class="button tool-support-button" href="https://www.buymeacoffee.com/pavel.zosim">☕ Buy me a coffee</a></div>
  <p class="eyebrow">Use Tab to inspect focus. Disabled controls are not interactive. Navigation remains a real link.</p>
 </section>
 <section class="document-section" id="fields"><header class="section-label"><span>02</span><h2>Fields &amp; engineering range</h2></header>
  <form class="control-form">
   <div class="field-grid"><label>Seed<input type="number" name="seed" value="1024" required min="0" max="2147483647"></label><label>Output resolution<select name="resolution"><option>512 × 512</option><option>1024 × 1024</option><option>4096 × 4096</option></select></label></div>
   <label for="detail-range">Detail strength <output id="detail-value" for="detail-range">35</output><span class="range-scale"><input id="detail-range" type="range" name="detail" min="0" max="100" value="35"></span></label>
   <label>Unavailable setting<input value="Requires input frames" disabled></label>
   <label class="control-check"><input type="checkbox" checked><span>Optional setting</span><small class="control-hint">Use for an independent on/off option.</small></label>
  </form>
 </section>
 <section class="document-section" id="states"><header class="section-label"><span>03</span><h2>Empty, warning &amp; error</h2></header>
  <p class="notice" id="demo-result" role="status">Ready. Settings are valid.</p>
  <div class="empty-state"><h3>No outputs yet</h3><p>Add source images to begin. Original files stay on your device.</p></div>
  <p class="notice notice--warning"><strong>Warning.</strong> The encoded file is larger than the source. Review dimensions and quality before exporting.</p>
  <p class="notice notice--error"><strong>Could not decode this image.</strong> Choose a supported PNG or JPEG file. No other frames were removed.</p>
 </section>
 <section class="document-section" id="panels"><header class="section-label"><span>05</span><h2>Settings groups & disclosure</h2></header><p>Use on tool settings: group related fields and collapse secondary options. Keep process actions and status outside the disclosure.</p><div id="disclosure-example"></div></section>
 <section class="document-section" id="extension"><header class="section-label"><span>06</span><h2>Extension &amp; review</h2></header><ol><li>Check this register and the existing article patterns before creating a component.</li><li>Add the shared implementation and a working example here, including empty, disabled, focus and error states where applicable.</li><li>Replace existing duplicates; do not layer a page override over the old rule.</li><li>Check keyboard access, narrow screens and existing tool behaviour before accepting the change.</li></ol><div id="article-patterns"></div></section>
 <section class="document-section" id="density"><header class="section-label"><span>04</span><h2>Content card</h2></header><p>Use for linked content summaries. Two examples show long and short titles; geometry and spacing remain the same.</p>
  <div class="card-grid"><article class="card"><p class="eyebrow">TOOL / LONG TITLE</p><h3><a href="?page=tool">Sprite Sheet Assembly — arrange, preview and export a transparent texture atlas</a></h3><p>One full-area destination. The card is not a button face; the title remains its accessible link name.</p></article><article class="card"><p class="eyebrow">TOOL / SHORT TITLE</p><h3><a href="?page=index">Online Tools</a></h3><p>Short content uses the same padding, gap and focus treatment.</p></article></div>
 </section>
</template></body></html>
